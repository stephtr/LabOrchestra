name: spikes
on:
  push:
    branches: [next]
    paths: ['spikes/**']
  workflow_dispatch:
    inputs:
      spikes:
        description: Spikes to run, e.g. "01 04"
        default: 01 02 03 04
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      spikes: ${{ steps.s.outputs.spikes }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: s
        env:
          INPUT: ${{ inputs.spikes }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT" ]; then L="$INPUT"
          else L=$(git diff --name-only "$BEFORE" HEAD -- spikes | sed -nE 's#^spikes/([0-9]{2})-.*#\1#p' | sort -u | tr '\n' ' '); fi
          echo "spikes=$L" | tee -a "$GITHUB_OUTPUT"
  spike:
    needs: select
    if: needs.select.outputs.spikes != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            11.0.x
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install uv psutil websockets msgpack
      - name: 01 SignalR client
        if: contains(needs.select.outputs.spikes, '01')
        working-directory: spikes/01-signalr
        run: |
          dotnet build -c Release -v q
          ./bin/Release/net9.0/srv > srv.log 2>&1 & 
          python test.py; R=$?; kill %1 || true; exit $R
      - name: 02 workers
        if: ${{ !cancelled() && contains(needs.select.outputs.spikes, '02') }}
        working-directory: spikes/02-workers
        run: |
          dotnet build -c Release -v q
          python -u test.py
      - name: 03 widgets
        if: ${{ !cancelled() && contains(needs.select.outputs.spikes, '03') }}
        working-directory: spikes/03-widgets
        run: |
          npm ci
          npm run build
          dotnet build -c Release -v q
          node test.mjs
      - name: 04 FFT
        if: ${{ !cancelled() && contains(needs.select.outputs.spikes, '04') }}
        working-directory: spikes/04-fft
        run: |
          bash build.sh
          dotnet build -c Release -v q
          if [ "$RUNNER_OS" = Windows ]; then ls bin/Release/net11.0/ffts-dlls; cp -r bin/Release/net11.0/ffts-dlls . ; fi
          ./bin/Release/net11.0/fft
